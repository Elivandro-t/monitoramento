<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>ICMP Response Time</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
  <style>
    body {
      background-color: #1e1e1e;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:0 20px ;
      scrollbar-width: thin;
      scrollbar-color: #3a3939;
    }

    .chart-container {
      display: flex;
      justify-content: center;
      width: 1200px;
      /* Largura maior */
      height: 500px;
      /* Altura maior */
      margin: auto;
    }


    .chart-containerw {
      width: 75px;
      height: 70px;
      position: relative;
    }
    #icmpChart,
    #latencyChart {
      background-color: #302e2e;
      max-width: 100%;
      max-height: 400px;

    }

    .ls {
      display: flex;
      padding:0 25px;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .percent-label {
      position: absolute;
      top: 65%;
      /* Ajuste fino: estava 50%, agora está mais abaixo */
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #81c784;
      font-family: sans-serif;
      pointer-events: none;
    }
    h1{
      margin:0;
      padding: 0;
    }
    .container{
      display: flex;
      align-items: center;
      gap: 25px;
      justify-content: space-around;
    }
  </style>
</head>

<body>
  
  <div class="container">
    <h2 id="titule"></h2>
    <section class="ls">
      <div class="chart-containerw" id="canv">
        <canvas id="gaugeChart"></canvas>
        <div class="percent-label" id="percentLabel">0%</div>
      </div>
    </section>
  </div>
  <canvas id="icmpChart"></canvas>
  <div class="chart-container">
    <canvas id="latencyChart" width="100%" height="400"></canvas>
  </div>
  <script src="../static/css/grafico.js"></script>
  <script th:src="@{/css/grafico.js}"></script>
</body>

</html>
