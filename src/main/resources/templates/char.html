<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento ICMP | Pro</title>
  <link rel="stylesheet" th:href="@{/css/char.css}">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="dark-theme">

<div class="dashboard">
  <header class="header">
    <h2 id="titule">Iniciando Monitoramento...</h2>
    <div id="ip-badge" class="badge">IP: --.---.---.--</div>
  </header>

  <div class="grid-container">
    <div class="card gauge-card">
      <span class="label">Perda Atual</span>
      <div class="chart-wrapper">
        <canvas id="gaugeChart"></canvas>
        <div id="percentLabel" class="gauge-value">0%</div>
      </div>
    </div>

    <div class="card latency-card">
      <span class="label">Latência em Tempo Real</span>
      <div class="chart-wrapper">
        <canvas id="latencyChart"></canvas>
      </div>
    </div>

    <div class="card history-card">
      <span class="label">Histórico de Estabilidade</span>
      <div class="chart-wrapper">
        <canvas id="icmpChart"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="overlay-loader">
  <div class="spinner"></div>
</div>

<script th:src="@{/css/grafico.js}"></script>
</body>
</html>
