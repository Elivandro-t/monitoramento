<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Endpoint</title>
    <link rel="stylesheet" th:href="@{/css/equipamentos.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <style>
        body { padding: 20px; }
        .reg-container { max-width: 1100px; margin: 0 auto; }
        .reg-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 22px; margin-bottom: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,.35);
        }
        .reg-card h2 {
            font-size: 16px; color: #58a6ff; font-weight: 700; margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .reg-card .sub { font-size: 11px; color: #8b949e; margin-bottom: 16px; }
        .reg-form {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px;
        }
        .reg-form .full { grid-column: 1 / -1; }
        .reg-form label {
            display: block; font-size: 10.5px; color: #8b949e; font-weight: 600;
            text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px;
        }
        .reg-form input, .reg-form select {
            width: 100%; background: #0d1117; border: 1px solid #30363d;
            color: #c9d1d9; padding: 9px 11px; border-radius: 7px; font-size: 12.5px;
            transition: border-color .15s, box-shadow .15s;
        }
        .reg-form input:focus, .reg-form select:focus {
            outline: none; border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,.2);
        }
        .reg-actions {
            display: flex; justify-content: flex-end; gap: 8px;
            margin-top: 18px; padding-top: 14px; border-top: 1px solid #30363d;
        }
        .alert {
            padding: 10px 12px; border-radius: 7px; font-size: 12px; margin-bottom: 12px;
        }
        .alert-ok   { background: rgba(63,185,80,.12);  border:1px solid rgba(63,185,80,.4);  color:#3fb950; }
        .alert-err  { background: rgba(248,81,73,.12);  border:1px solid rgba(248,81,73,.4);  color:#ff7b72; }
        .file-input {
            width: 100%; background: #0d1117; border: 1px dashed #30363d; color:#c9d1d9;
            padding: 18px; border-radius: 7px; font-size: 12px; cursor: pointer;
            text-align: center;
        }
        .file-input:hover { border-color: #58a6ff; }
        .reg-tip { font-size: 10.5px; color: #6e7681; }
        .section-icon { color:#1f6feb; }
    </style>
</head>
<body>

<div class="reg-container">

    <!-- Mensagens -->
    <div th:if="${mensagem}" class="alert alert-ok" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-err" th:text="${erro}"></div>

    <!-- CARD 1: Cadastro manual -->
    <div class="reg-card" id="card-manual">
        <h2><span class="section-icon">&#128736;</span> <span th:text="${form!=null} ? 'Editar Endpoint' : 'Novo Endpoint'"></span></h2>
        <div class="sub">Informe os dados do dispositivo (AP, switch, host) que sera monitorado.</div>

        <form method="post" action="/endpoint/registro" id="form-endpoint">
            <input type="hidden" name="_method" value="put" th:if="${form!=null}">
            <input type="hidden" name="id" th:value="${form?.id}">

            <div class="reg-form">
                <div class="full">
                    <label>Nome / Hostname</label>
                    <input type="text" name="nome" th:value="${form?.nome}" placeholder="Ex: AP-CD116-01" required>
                </div>

                <div>
                    <label>MAC Address</label>
                    <input type="text" id="mac" name="mac" th:value="${form?.mac}" maxlength="17" placeholder="00:00:00:00:00:00">
                </div>

                <div>
                    <label>IP Address</label>
                    <input type="text" name="ip" th:value="${form?.ip}" placeholder="10.0.0.1">
                </div>

                <div>
                    <label>Numero de Serie</label>
                    <input type="text" name="sn" th:value="${form?.sn}" placeholder="S/N">
                </div>

                <div>
                    <label>Modelo</label>
                    <input type="text" name="modelo" th:value="${form?.modelo}" placeholder="Ex: Aruba IAP-305">
                </div>

                <div>
                    <label>Localizacao</label>
                    <input type="text" name="localizacao" th:value="${form?.localizacao}" placeholder="Sala / Andar">
                </div>

                <div>
                    <label>Data</label>
                    <input type="text" name="data" th:value="${form?.data}" placeholder="dd/mm/aaaa">
                </div>

                <div class="full">
                    <label>Link</label>
                    <input type="text" name="link" th:value="${form?.link}" placeholder="https://...">
                </div>

                <div th:if="${form==null}">
                    <label>Bloco / Setor</label>
                    <select name="setorID" required>
                        <option value="">Selecione um Bloco</option>
                        <option th:each="item:${setor}" th:value="${item?.id}" th:text="|${item?.nome}  ${item?.filial}|"></option>
                    </select>
                </div>

                <div th:if="${form==null}">
                    <label>Categoria / Grupo</label>
                    <select name="ReceiveGrupoId" required>
                        <option value="">Selecione uma Categoria</option>
                        <option th:each="item:${groups}" th:value="${item?.id}" th:text="|${item?.id} ${item?.nome}|"
                                th:selected="${item.id == selectedGroupId}"></option>
                    </select>
                </div>
            </div>

            <div class="reg-actions">
                <button type="button" class="btn" onclick="history.back()">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="btnEnviar">
                    <span th:text="${form!=null} ? 'Atualizar' : 'Cadastrar'">Cadastrar</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Toggle upload em lote -->
    <div class="reg-card" th:if="${form==null}" style="padding:14px 22px;">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;color:#c9d1d9;text-transform:none;letter-spacing:normal;margin:0;">
            <input type="checkbox" id="toggle-upload" onchange="alternarModo(this.checked)" style="width:16px;height:16px;cursor:pointer;">
            <span><strong>Upload em lote</strong> - marque para cadastrar varios endpoints via planilha Excel</span>
        </label>
    </div>

    <script>
        function alternarModo(enviarPlanilha) {
            var manual = document.getElementById('card-manual');
            var upload = document.getElementById('card-upload');
            if (manual) manual.style.display = enviarPlanilha ? 'none' : '';
            if (upload) upload.style.display = enviarPlanilha ? '' : 'none';
        }
    </script>

    <!-- CARD 2: Upload em lote (escondido ate marcar o checkbox) -->
    <div class="reg-card" id="card-upload" th:if="${form==null}" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
            <div>
                <h2><span class="section-icon">&#128228;</span> Upload em lote (Excel)</h2>
                <div class="sub">Envie uma planilha .xlsx para cadastrar varios endpoints de uma so vez.</div>
            </div>
            <a th:href="@{/endpoint/modelo}" class="btn" download
               style="background:#238636; border:1px solid #2ea043; color:#fff; padding:7px 12px; border-radius:6px; font-size:12px; text-decoration:none; white-space:nowrap;">
                &#11015; Baixar Modelo
            </a>
        </div>

        <form method="post" action="/endpoint/mult" id="arquivo" enctype="multipart/form-data">
            <div class="reg-form">
                <div>
                    <label>Complexo</label>
                    <select required name="nome">
                        <option value="">Selecione um complexo</option>
                        <option th:each="item:${setor}" th:value="${item.nome}" th:text="|${item.nome}  ${item?.filial}|"
                                th:selected="${item.nome == nome}"></option>
                    </select>
                </div>
                <div>
                    <label>Categoria</label>
                    <select name="ReceiveGrupoId" id="host" required>
                        <option value="">Selecione uma Categoria</option>
                        <option th:each="item:${groups}" th:value="${item?.id}" th:text="|${item.id} ${item?.nome}|"
                                th:selected="${item?.id == selectedGroupId}"></option>
                    </select>
                </div>
                <div class="full">
                    <label>Arquivo (.xlsx)</label>
                    <input type="file" name="file" accept=".xls,.xlsx,*/*" required class="file-input">
                    <div class="reg-tip" style="margin-top:6px">Dica: a primeira aba da planilha sera processada.</div>
                </div>
            </div>

            <div class="reg-actions">
                <button type="submit" class="btn btn-primary">Enviar Planilha</button>
            </div>
        </form>
    </div>

</div>

<script th:src="@{/css/group.js}"></script>
<script th:src="@{/css/javascript.js}"></script>
</body>
</html>
