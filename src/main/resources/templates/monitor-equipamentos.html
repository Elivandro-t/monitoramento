<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Tempo Real | Equipamentos</title>
    <link rel="stylesheet" th:href="@{/css/equipamentos.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .mon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }
        .mon-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.25s;
        }
        .mon-card.alerta {
            border-color: #f85149;
            box-shadow: 0 0 14px rgba(248,81,73,0.3);
            animation: alert-pulse 1.6s infinite;
        }
        .mon-card.offline { opacity: 0.55; border-color: #8b949e; }
        @keyframes alert-pulse {
            0%,100% { box-shadow: 0 0 10px rgba(248,81,73,0.2); }
            50% { box-shadow: 0 0 22px rgba(248,81,73,0.6); }
        }
        .mon-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #21262d;
        }
        .mon-hostname { font-size: 13px; color: #58a6ff; font-weight: 700; }
        .mon-subinfo { font-size: 10px; color: #8b949e; }
        .mon-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .mon-metric {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 6px;
            padding: 7px 6px;
            text-align: center;
        }
        .mon-metric-label { font-size: 9px; color: #8b949e; text-transform: uppercase; }
        .mon-metric-value { font-size: 14px; font-weight: 700; }
        .value-ok { color: #3fb950; }
        .value-warn { color: #d29922; }
        .value-crit { color: #f85149; }
        .mon-chart-wrap { height: 120px; }
        .mon-timestamp {
            font-size: 9px;
            color: #94a3b8;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(59, 130, 246, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }
        .alerta-banner {
            background: rgba(248,81,73,0.15);
            border: 1px solid #f85149;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            color: #f85149;
            font-size: 12px;
            font-weight: 600;
            display: none;
        }
        .alerta-banner.show { display: block; }
    </style>
</head>
<body>

<div class="eq-container">

    <header class="eq-header">
        <div>
            <h1>Monitor Tempo Real</h1>
            <div class="subtitle">CPU, memoria e disco em tempo real + alertas</div>
        </div>
        <div class="eq-header-actions">
            <button class="btn btn-back" onclick="window.location.href='/endpoint/equipamentos'">&larr; Lista</button>
            <div class="filtro-grupo">
                <label for="mon-setor">Filtro Setor</label>
                <select id="mon-setor" onchange="renderMon()">
                    <option value="">Todos</option>
                    <option>RH</option><option>SAC</option><option>TRANSPORT</option>
                    <option>SAC HORT</option><option>RECEBIMENTO</option>
                    <option>FATURAMENTO EXPED</option><option>FATURAMENTO RECEB</option>
                </select>
            </div>
            <div class="filtro-grupo">
                <label for="mon-alerta">Limiar alerta (%)</label>
                <select id="mon-alerta">
                    <option value="70">70%</option>
                    <option value="80" selected>80%</option>
                    <option value="90">90%</option>
                </select>
            </div>
        </div>
    </header>

    <div id="banner" class="alerta-banner"></div>

    <div class="eq-summary">
        <div class="summary-card"><span class="summary-label">Total</span><span class="summary-value" id="mt-total">0</span></div>
        <div class="summary-card"><span class="summary-label">Online</span><span class="summary-value ok" id="mt-online">0</span></div>
        <div class="summary-card"><span class="summary-label">Offline</span><span class="summary-value off" id="mt-off">0</span></div>
        <div class="summary-card"><span class="summary-label">Alertas CPU</span><span class="summary-value crit" id="mt-a-cpu">0</span></div>
        <div class="summary-card"><span class="summary-label">Alertas Mem</span><span class="summary-value crit" id="mt-a-mem">0</span></div>
        <div class="summary-card"><span class="summary-label">Alertas Disco</span><span class="summary-value crit" id="mt-a-disc">0</span></div>
    </div>

    <div id="mon-grid" class="mon-grid"></div>
</div>

<script>
var AUTH_TOKEN = localStorage.getItem('auth_token') || '';
var agentes = [];
var history = {}; // agentId -> { labels, cpu, mem, disk }
var charts = {};  // agentId -> Chart
var HIST_SIZE = 20;

function authHeaders() { return AUTH_TOKEN ? {'Authorization': AUTH_TOKEN} : {}; }

function formatNow() {
    var d = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function carregar() {
    fetch('/agentes', { headers: authHeaders() })
        .then(function(r){ return r.json(); })
        .then(function(data){
            agentes = Array.isArray(data) ? data : [];
            renderMon();
        })
        .catch(function(){});
}

function limiar() { return Number(document.getElementById('mon-alerta').value) || 80; }

function renderMon() {
    var setor = document.getElementById('mon-setor').value;
    var limite = limiar();
    var lista = agentes.filter(function(a){ return !setor || (a.setor||'').toUpperCase() === setor.toUpperCase(); });

    var total = lista.length, online = 0, off = 0, aCpu = 0, aMem = 0, aDisc = 0;
    lista.forEach(function(a){
        if (a.status === 'ONLINE') online++; else off++;
        if ((a.cpu||0) >= limite) aCpu++;
        if ((a.memoriaPercent||0) >= limite) aMem++;
        if ((a.discoPercent||0) >= limite) aDisc++;
    });
    document.getElementById('mt-total').innerText = total;
    document.getElementById('mt-online').innerText = online;
    document.getElementById('mt-off').innerText = off;
    document.getElementById('mt-a-cpu').innerText = aCpu;
    document.getElementById('mt-a-mem').innerText = aMem;
    document.getElementById('mt-a-disc').innerText = aDisc;

    var banner = document.getElementById('banner');
    var totalAlertas = aCpu + aMem + aDisc;
    if (totalAlertas > 0) {
        banner.innerText = '⚠ ATENCAO: ' + totalAlertas + ' alerta(s) acima de ' + limite + '% detectados!';
        banner.classList.add('show');
    } else {
        banner.classList.remove('show');
    }

    var grid = document.getElementById('mon-grid');
    // Remove cards que nao existem mais
    var idsAtuais = new Set(lista.map(function(a){ return 'card-' + a.agentId; }));
    Array.from(grid.children).forEach(function(c){ if (!idsAtuais.has(c.id)) c.remove(); });

    lista.forEach(function(a){
        var cardId = 'card-' + a.agentId;
        var card = document.getElementById(cardId);
        var isAlerta = (a.cpu >= limite) || (a.memoriaPercent >= limite) || (a.discoPercent >= limite);
        var isOff = a.status !== 'ONLINE';

        if (!card) {
            card = document.createElement('div');
            card.id = cardId;
            card.className = 'mon-card';
            card.innerHTML = cardHtml(a);
            grid.appendChild(card);
            criarChart(a);
        } else {
            atualizarCardConteudo(card, a);
        }
        card.className = 'mon-card' + (isOff ? ' offline' : (isAlerta ? ' alerta' : ''));
        atualizarHistorico(a);
        atualizarChart(a);
    });
}

function cardHtml(a) {
    var cpu = Number(a.cpu)||0, mem = Number(a.memoriaPercent)||0, disc = Number(a.discoPercent)||0;
    return '' +
    '<div class="mon-head">' +
        '<div>' +
            '<div class="mon-hostname">' + esc(a.hostname || a.agentId) + '</div>' +
            '<div class="mon-subinfo">' + esc(a.setor || '--') + ' · ' + esc(a.filial || '--') + ' · ' + esc(a.ip || '--') + '</div>' +
        '</div>' +
        '<span class="mon-timestamp" id="ts-' + a.agentId + '">' + esc(a.ultimoContato || '--:--') + '</span>' +
    '</div>' +
    '<div class="mon-metrics">' +
        '<div class="mon-metric"><span class="mon-metric-label">CPU</span><div class="mon-metric-value ' + classeMetrica(cpu) + '" id="v-cpu-' + a.agentId + '">' + cpu.toFixed(1) + '%</div></div>' +
        '<div class="mon-metric"><span class="mon-metric-label">Memoria</span><div class="mon-metric-value ' + classeMetrica(mem) + '" id="v-mem-' + a.agentId + '">' + mem.toFixed(1) + '%</div></div>' +
        '<div class="mon-metric"><span class="mon-metric-label">Disco</span><div class="mon-metric-value ' + classeMetrica(disc) + '" id="v-disc-' + a.agentId + '">' + disc.toFixed(1) + '%</div></div>' +
    '</div>' +
    '<div class="mon-chart-wrap"><canvas id="chart-' + a.agentId + '"></canvas></div>';
}

function atualizarCardConteudo(card, a) {
    var cpu = Number(a.cpu)||0, mem = Number(a.memoriaPercent)||0, disc = Number(a.discoPercent)||0;
    var ts = document.getElementById('ts-' + a.agentId);
    if (ts) ts.innerText = a.ultimoContato || formatNow();
    var vc = document.getElementById('v-cpu-' + a.agentId);
    var vm = document.getElementById('v-mem-' + a.agentId);
    var vd = document.getElementById('v-disc-' + a.agentId);
    if (vc) { vc.innerText = cpu.toFixed(1) + '%'; vc.className = 'mon-metric-value ' + classeMetrica(cpu); }
    if (vm) { vm.innerText = mem.toFixed(1) + '%'; vm.className = 'mon-metric-value ' + classeMetrica(mem); }
    if (vd) { vd.innerText = disc.toFixed(1) + '%'; vd.className = 'mon-metric-value ' + classeMetrica(disc); }
}

function classeMetrica(v) {
    var L = limiar();
    if (v >= L) return 'value-crit';
    if (v >= L - 15) return 'value-warn';
    return 'value-ok';
}

function atualizarHistorico(a) {
    var h = history[a.agentId] || { labels: [], cpu: [], mem: [], disk: [] };
    if (h.labels.length >= HIST_SIZE) { h.labels.shift(); h.cpu.shift(); h.mem.shift(); h.disk.shift(); }
    var d = new Date();
    var tsLabel = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
    h.labels.push(tsLabel);
    h.cpu.push(Number(a.cpu)||0);
    h.mem.push(Number(a.memoriaPercent)||0);
    h.disk.push(Number(a.discoPercent)||0);
    history[a.agentId] = h;
}

function criarChart(a) {
    var el = document.getElementById('chart-' + a.agentId);
    if (!el) return;
    var h = history[a.agentId] || { labels: [], cpu: [], mem: [], disk: [] };
    charts[a.agentId] = new Chart(el.getContext('2d'), {
        type: 'line',
        data: {
            labels: h.labels,
            datasets: [
                { label:'CPU', data: h.cpu, borderColor:'#58a6ff', backgroundColor:'rgba(88,166,255,0.1)', tension:0.3, pointRadius:0, borderWidth:1.5, fill:true },
                { label:'Memoria', data: h.mem, borderColor:'#3fb950', backgroundColor:'rgba(63,185,80,0.1)', tension:0.3, pointRadius:0, borderWidth:1.5, fill:true },
                { label:'Disco', data: h.disk, borderColor:'#d29922', backgroundColor:'rgba(210,153,34,0.1)', tension:0.3, pointRadius:0, borderWidth:1.5, fill:true }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: {
                y: { min:0, max:100, ticks: { color:'#8b949e', font:{size:9} }, grid:{ color:'rgba(139,148,158,0.12)' } },
                x: { ticks: { color:'#8b949e', font:{size:9}, maxTicksLimit: 5 }, grid:{ display:false } }
            },
            plugins: {
                legend: { labels: { color:'#8b949e', font:{size:10}, boxWidth: 10 } },
                tooltip: { mode: 'index', intersect: false }
            }
        }
    });
}

function atualizarChart(a) {
    var c = charts[a.agentId];
    var h = history[a.agentId];
    if (!c || !h) return;
    c.data.labels = h.labels;
    c.data.datasets[0].data = h.cpu;
    c.data.datasets[1].data = h.mem;
    c.data.datasets[2].data = h.disk;
    c.update('none');
}

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function conectarWS() {
    try {
        var s = new SockJS('/ws');
        var stomp = Stomp.over(s);
        stomp.debug = null;
        stomp.connect({}, function(){
            stomp.subscribe('/topic/agentes', function(){
                carregar();
            });
        });
    } catch(e) {}
}

window.addEventListener('DOMContentLoaded', function(){
    carregar();
    conectarWS();
    setInterval(carregar, 3000);
});
</script>

</body>
</html>
