<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC - Monitoramento de Rede</title>
    <link rel="stylesheet" th:href="@{/css/listaweb.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
</head>
<body>

<header class="area_container" id="sumi">
    <div class="header-left">
        <span class="header-title">MONITORANDO...</span>

        <div class="counters-wrap">
            <div class="counter-box total-box">
                <span class="counter-label">Total</span>
                <span class="counter-value" id="total-count">0</span>
            </div>
            <div class="counter-box online-box">
                <span class="counter-label">Online</span>
                <span class="counter-value" id="online-count">0</span>
            </div>
            <div class="counter-box offline-box">
                <span class="counter-label">Offline</span>
                <span class="counter-value" id="offline-count">0</span>
            </div>
            <div class="counter-box warning-box">
                <span class="counter-label">Intermitente</span>
                <span class="counter-value" id="intermitente-count">0</span>
            </div>
        </div>
    </div>

    <div class="header-right">
        <select id="filtro-grupo" class="filtro-select">
            <option value="">Todos os Grupos</option>
        </select>
        <button id="enviar" onclick="toggleFullscreen()">Tela Cheia</button>
    </div>
</header>

<!-- Loading -->
<div id="loading-container" class="loading-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">Conectando ao servidor...</p>
</div>

<main class="area_grid" id="meuContainer" style="display:none;">
</main>

<script th:src="@{/css/visualweb.js}"></script>
</body>
</html>
