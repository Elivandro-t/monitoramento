<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC - Monitoramento de Rede</title>
    <link rel="stylesheet" th:href="@{/css/listaweb.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
</head>
<body>

<header class="area_container" id="sumi">
    <div style="display: flex; gap: 15px; align-items: center;">
        <span style="color: #3498db; font-weight: bold; font-size: 16px;">MONITORANDO...</span>

        <div class="counter-box online-box">
            <span class="counter-label">Online</span>
            <span class="counter-value" id="online-count">0</span>
        </div>

        <div class="counter-box offline-box">
            <span class="counter-label">Offline</span>
            <span class="counter-value" id="offline-count">0</span>
        </div>
    </div>

    <div>
        <button id="enviar" onclick="toggleFullscreen()">Tela Cheia</button>
    </div>
</header>

<main class="area_grid" id="meuContainer">
</main>

<script th:src="@{/css/visualweb.js}"></script>
</body>
</html>
