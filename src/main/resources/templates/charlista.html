<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-CD116 - Dashboard NOC</title>
    <link rel="stylesheet" th:href="@{/css/listaChat.css}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
</head>
<style>
    :root {
        --bg-dark: #0b0e14;
        --card-bg: #161b22;
        --header-bg: #0d1117;
        --text-main: #c9d1d9;
        --primary: #58a6ff;
        --success: #238636;
        --danger: #da3633;
        --border: #30363d;
    }

    * { box-sizing: border-box; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
    }

    /* --- HEADER (FULL WIDTH) --- */
    .log {
        background: var(--header-bg);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 10px 15px;
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .header-content-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }

    /* Título Responsivo */
    .mn h1 {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    #status {
        font-size: 10px;
        font-weight: bold;
        color: #8b949e;
    }

    /* --- CONTADORES E BUSCA --- */
    .summary-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 10px;
        flex-wrap: wrap;
    }

    .hd { display: flex; gap: 10px; }

    .summary-card {
        background: var(--card-bg);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        text-align: center;
        min-width: 120px;
    }

    .summary-card.on { border-bottom: 3px solid var(--success); }
    .summary-card.off { border-bottom: 3px solid var(--danger); }

    .summary-card label { font-size: 9px; color: #8b949e; display: block; }
    .summary-card span { font-size: 20px; font-weight: 800; }

    .actions-group.hd2 { display: flex; align-items: center; flex: 1; justify-content: flex-end; }

    .search-wrapper { display: flex; gap: 5px; width: 100%; max-width: 400px; }

    .search-wrapper select {
        background: #1c2128;
        color: #fff;
        border: 1px solid var(--border);
        padding: 0 10px;
        height: 38px;
        border-radius: 6px;
        flex: 1;
        outline: none;
    }

    button#enviar, .btn-zoom {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 0 12px;
        height: 38px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
    }

    .btn-zoom { background: var(--card-bg); border: 1px solid var(--border); }

    /* --- GRID --- */
    .ls {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 15px;
        padding: 15px;
        width: 100%;
    }

    /* Card (JS depende desta classe) */
    .area1 {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        position: relative;
    }

    /* --- FIX MOBILE (461px) --- */
    @media (max-width: 461px) {
        .mn h1 {
            font-size: 14px !important; /* Diminui título no mobile */
            max-width: 200px;
            line-height: 1.2;
        }

        .header-top { align-items: flex-start; }

        .summary-container {
            flex-direction: column;
            align-items: stretch;
        }

        .hd {
            width: 100%;
            justify-content: space-between;
        }

        .summary-card {
            flex: 1;
            min-width: 0;
        }

        .actions-group.hd2 {
            width: 100%;
            justify-content: stretch;
        }

        .search-wrapper {
            max-width: 100%;
        }

        .ls {
            grid-template-columns: repeat(2, 1fr) !important; /* 2 cards por linha */
            gap: 8px;
            padding: 8px;
        }

        .area1 { padding: 5px; }
    }

    .overlay-loader { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .spinner { width: 30px; height: 30px; border: 3px solid #30363d; border-top-color: var(--primary); border-radius: 50%; animation: ping 0.8s infinite linear; }
    @keyframes ping { to { transform: rotate(360deg); } }
</style>

<body>
<script th:inline="javascript" th:src="@{/css/char.js}"></script>

<div class="log">
    <div class="header-content-wrapper">
        <div class="header-top">
            <div class="mn">
                <h1 id="Monitoramento">Rede Monitor - NOC</h1>
                <div id="status">Verificando...</div>
            </div>

            <button onclick="toggleFullscreen()" class="btn-zoom">
                <span class="material-symbols-outlined">fullscreen</span>
            </button>
        </div>

        <div class="summary-container" id="summary-counters">
            <div class="hd">
                <div class="summary-card on">
                    <label>Online</label>
                    <span id="count-up-total">0</span>
                </div>
                <div class="summary-card off">
                    <label>Offline</label>
                    <span id="count-down-total">0</span>
                </div>
            </div>

            <div class="actions-group hd2">
                <form id="form" onsubmit="event.preventDefault();" class="search-wrapper">
                    <select id="stc"></select>
                    <button onclick="buscarMac()" id="enviar">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<main id="main">
    <div id="overlay-loader" style="display:none;"><div class="spinner"></div></div>
    <div id="overlay" style="text-align: center; margin-top: 5rem; color: #8b949e;"></div>
    <div id="device-grid" class="ls"></div>
</main>

<script>
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(err);
            });
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }
</script>
</body>
</html>
