<style>
    @keyframes ping{
        0%{
             transform: rotate(0deg);
        }
        100%{
            transform: rotate(360deg);
        }
    }
    .overlay-loader{
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .spinner{
        position: absolute;
        top: 50%;
        left: 50%;
        width:28px;
        border:4px solid #f3f3f3;
        border-top: 4px solid #79c0f0;
        height: 28px;
        border-radius:50%;
        animation:  ping 700ms infinite linear;

    }
    #overlay{
        width: 100%;
        text-align: center;
        font-size:17px;
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 15rem;
        display: none;
        color: #888;
    }

    .label{
        font-size:12px;
        color: #888;
        font-family: Arial, Helvetica, sans-serif;

</style>
