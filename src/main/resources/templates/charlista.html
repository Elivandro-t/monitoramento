<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI-CD116 - Dashboard NOC</title>
    <link rel="stylesheet" th:href="@{/css/listaChat.css}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
</head>
<style>
    :root {
        --bg-dark: #0b0e14;
        --card-bg: #161b22;
        --header-bg: #0d1117;
        --text-main: #c9d1d9;
        --primary: #58a6ff;
        --success: #238636;
        --danger: #da3633;
        --border: #30363d;
    }

    * { box-sizing: border-box; }

    @keyframes ping {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        margin: 0;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* --- HEADER --- */
    .log {
        background: var(--header-bg);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        padding: 10px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .header-content-wrapper {
        width: 100%;
        max-width: 1400px;
        display: flex;
        flex-direction: column;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        flex-wrap: wrap;
        padding: 0 10px;
        gap: 15px;
    }

    .mn h1 {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
        margin: 0;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    #status {
        font-size: 11px;
        margin-top: 5px;
        font-weight: bold;
        color: #8b949e;
        text-transform: uppercase;
    }

    /* Ações à direita */
    .actions-group {
        display: flex;
        gap: 10px;
    }

    .search-wrapper {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .search-wrapper select {
        background: #1c2128;
        color: #fff;
        border: 1px solid var(--border);
        padding: 0 15px;
        height: 40px;
        border-radius: 6px;
        min-width: 250px;
        outline: none;
    }

    button#enviar, .btn-zoom {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 0 15px;
        height: 40px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: filter 0.2s;
    }

    .btn-zoom {
        background: var(--card-bg);
        border: 1px solid var(--border);
    }

    button:hover { filter: brightness(1.2); }

    /* --- CONTADORES --- */
    .summary-container {
        display: flex;
        padding: 5px 10px;
        justify-content: space-between; /* ISSO JOGA O FILTRO PARA O LADO */
        align-items: flex-end;
        width: 100%;
    }

    .summary-card {
        background: var(--card-bg);
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        text-align: center;
        min-width: 200px;
    }

    .summary-card.on { border-bottom: 3px solid var(--success); }
    .summary-card.off { border-bottom: 3px solid var(--danger); }

    .summary-card label {
        font-size: 10px;
        color: #8b949e;
        display: block;
        margin-bottom: 3px;
    }

    .summary-card span {
        font-size: 24px;
        font-family: 'Consolas', monospace;
        font-weight: 800;
    }

    /* --- GRID --- */
    .ls {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 15px;
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }

    /* Organização interna da linha de baixo */
    .hd {
        display: flex;
        gap: 25px;
    }

    .hd2 {
        display: flex;
        align-items: flex-end;
    }
    .material-symbols-outlined{
        color: white;
    }

    .area1 {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 15px;
    }

    .status-up-card { border-left: 4px solid var(--success); }
    .status-down-card { border-left: 4px solid var(--danger); }

    /* Loader */
    .overlay-loader {
        position: fixed; inset: 0; z-index: 9999;
        background-color: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center;
    }

    .spinner {
        width: 40px; height: 40px; border: 4px solid #30363d;
        border-top: 4px solid var(--primary); border-radius: 50%;
        animation: ping 700ms infinite linear;
    }

    #status.online { color: var(--success); }
    #status.offline { color: var(--danger); }
</style>

<body>
<script th:inline="javascript" th:src="@{/css/char.js}"></script>

<div class="log">
    <div class="header-content-wrapper">
        <div class="header-top">
            <div class="mn">
                <h1 id="Monitoramento">Rede Monitor - NOC</h1>
                <div id="status">Verificando...</div>
            </div>

            <button onclick="toggleFullscreen()" class="btn-zoom" title="Tela Cheia">
                <span class="material-symbols-outlined">fullscreen</span>
            </button>
        </div>

        <div class="summary-container" id="summary-counters" >
            <div class="hd">
                <div class="summary-card on">
                    <label>Online</label>
                    <span id="count-up-total">0</span>
                </div>
                <div class="summary-card off">
                    <label>Offline</label>
                    <span id="count-down-total">0</span>
                </div>
            </div>

            <div class="actions-group hd2">
                <form id="form" onsubmit="event.preventDefault();" class="search-wrapper">
                    <select id="stc"></select>
                    <button onclick="buscarMac()" id="enviar">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<main id="main">
    <div id="overlay-loader"><div class="spinner"></div></div>
    <div id="overlay" style="text-align: center; margin-top: 5rem; color: #8b949e;"></div>
    <div id="device-grid" class="ls"></div>
</main>

<script>
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Erro ao tentar ativar tela cheia: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>
</body>
</html>
