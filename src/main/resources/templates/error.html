<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro do Sistema</title>
    <style>
        body { background:#0d1117; color:#c9d1d9; font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:32px; max-width:500px; width:100%; text-align:center; }
        h1 { color:#f97316; margin-bottom:12px; }
        p { color:#94a3b8; margin-bottom:20px; font-size:14px; line-height:1.6; }
        a { color:#38bdf8; text-decoration:none; font-weight:700; }
        a:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>Algo deu errado</h1>
    <p th:text="${mensagem} ?: 'Não foi possível concluir a operação. Tente novamente.'"></p>
    <a th:href="@{/}">Voltar para o início</a>
</div>
</body>
</html>
