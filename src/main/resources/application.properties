spring.application.name=projetoAP
spring.datasource.url=jdbc:mysql://localhost:3306/informatica
spring.datasource.username=root
spring.datasource.password=Tgfhvbnm1@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do HikariCP (pool de conexões recomendado para Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Dialeto do Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuração do Hibernate (opcional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true